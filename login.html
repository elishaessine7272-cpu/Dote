<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — StandpointHQ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/login.css" />
<style>
  :root{
    --ink:#0F1B33; --ink-deep:#081127; --teal:#12A594; --teal-light:#E1F5EE;
    --paper:#F4F6F5; --paper-card:#FFFFFF; --paper-alt:#EDF1EF; --slate:#3E4C60; --amber:#E8A33D;
    --line:rgba(15,27,51,0.10); --line-strong:rgba(15,27,51,0.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; line-height:1.6;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px;
    position:relative; overflow-x:hidden;
  }
  body::before{
    content:''; position:fixed; top:-20%; left:50%; transform:translateX(-50%);
    width:640px; height:640px; border-radius:50%;
    background:radial-gradient(circle, rgba(18,165,148,0.10), transparent 70%);
    pointer-events:none; z-index:0;
  }
  h1{font-family:'Space Grotesk',sans-serif; font-weight:600; letter-spacing:-0.02em;}
  a{color:inherit; text-decoration:none;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  .back-link{
    position:absolute; top:28px; left:28px; display:inline-flex; align-items:center; gap:6px;
    font-size:13.5px; font-weight:500; color:var(--slate); transition:color .15s ease;
  }
  .back-link:hover{color:var(--ink);}
  .back-link svg{width:14px; height:14px;}

  .login-card{
    width:100%; max-width:420px; background:var(--paper-card); border:1px solid var(--line);
    border-radius:22px; padding:44px 38px; box-shadow:0 40px 90px -30px rgba(15,27,51,0.28), 0 1px 0 rgba(255,255,255,0.6) inset;
    position:relative; z-index:1;
  }
  .login-card::before{
    content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:64px; height:4px; border-radius:0 0 6px 6px; background:var(--teal);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--teal); display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:14px;
  }
  .eyebrow::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--teal);}
  .login-card h1{font-size:26px; text-align:center; margin-bottom:8px;}
  .login-card .sub{font-size:14px; color:var(--slate); text-align:center; margin-bottom:32px;}

  .field{margin-bottom:18px;}
  .field label{display:block; font-size:13.5px; font-weight:600; margin-bottom:7px;}
  .field .input-wrap{position:relative;}
  .field-icon{
    position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--slate); display:flex; align-items:center; pointer-events:none;
  }
  .field-icon svg{width:16px; height:16px;}
  .field .input-wrap input{padding-left:42px;}
  .field input{
    width:100%; padding:13px 16px; border-radius:10px; border:1.5px solid var(--line-strong);
    font-family:'Inter',sans-serif; font-size:14px; color:var(--ink); background:var(--paper);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus{outline:none; border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-light); background:var(--paper-card);}
  .toggle-pw{
    position:absolute; right:14px; top:50%; transform:translateY(-50%); cursor:pointer; color:var(--slate);
    display:flex; align-items:center;
  }
  .toggle-pw svg{width:17px; height:17px;}

  .field-foot{display:flex; justify-content:flex-end; margin-top:8px;}
  .field-foot a{font-size:12.5px; color:var(--teal); font-weight:600;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; padding:15px 0; border-radius:999px;
    cursor:pointer; border:none; transition:all .2s ease; margin-top:6px;
  }
  .btn-deep{background:var(--ink); color:#fff; box-shadow:0 14px 28px -12px rgba(8,17,39,0.4);}
  .btn-deep:hover{background:var(--ink-deep); transform:translateY(-2px);}
  .btn-outline{background:transparent; color:var(--ink); border:1.5px solid var(--line-strong);}
  .btn-outline:hover{border-color:var(--teal); background:var(--teal-light);}

  .divider{display:flex; align-items:center; gap:14px; margin:26px 0; color:var(--slate); font-size:12px; font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.06em;}
  .divider::before, .divider::after{content:''; flex:1; height:1px; background:var(--line-strong);}

  .form-foot{text-align:center; margin-top:26px; font-size:13.5px; color:var(--slate);}
  .form-foot a{color:var(--teal); font-weight:600;}

  /* logo space at bottom, as requested */
  .logo-slot-bottom{
    margin-top:32px; padding-top:24px; border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; height:40px;
  }
  .logo-placehold{display:flex; align-items:center; height:100%;}
  .logo-placehold img{height:100%; width:auto; max-width:160px; object-fit:contain; display:block;}

  /* fixed help icon, bottom corner */
  .help-fab{
    position:fixed; bottom:26px; right:26px; width:52px; height:52px; border-radius:50%;
    background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:0 14px 28px -10px rgba(8,17,39,0.5); transition:all .2s ease; z-index:50;
  }
  .help-fab:hover{background:var(--ink-deep); transform:translateY(-2px);}
  .help-fab svg{width:22px; height:22px;}

  .help-popover{
    position:fixed; bottom:88px; right:26px; width:260px; background:var(--paper-card); border:1px solid var(--line-strong);
    border-radius:14px; padding:18px 20px; box-shadow:0 24px 48px -18px rgba(15,27,51,0.28);
    display:none; z-index:50;
  }
  .help-popover.open{display:block;}
  .help-popover b{display:block; font-family:'Space Grotesk',sans-serif; font-size:14px; margin-bottom:6px;}
  .help-popover p{font-size:12.5px; color:var(--slate); margin-bottom:12px;}
  .help-popover a{font-size:12.5px; color:var(--teal); font-weight:600; display:block; margin-bottom:4px;}

  @media (max-width:480px){
    .login-card{padding:34px 24px;}
    .back-link{position:static; margin-bottom:20px; display:inline-flex;}
    body{display:block; padding:24px 16px;}
    .login-card{margin:0 auto;}
  }
</style>
</head>
<body>

<a href="index.html" class="back-link">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  Back to Home 
</a>

<div class="login-card">
  <div class="eyebrow">Welcome back</div>
  <h1>Log in to your dashboard</h1>
  <p class="sub">Pick up right where you left off.</p>

  <form onsubmit="return handleLogin(event)">
    <div class="field">
      <label>Email address</label>
      <div class="input-wrap">
        <span class="field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
        <input type="email" placeholder="you@business.com" required>
      </div>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <span class="field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg></span>
        <input type="password" id="pwInput" placeholder="Enter your password" required>
        <span class="toggle-pw" onclick="togglePw()">
          <svg id="pwIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </span>
      </div>
      <div class="field-foot"><a href="#">Forgotten password?</a></div>
    </div>

    <button type="submit" class="btn btn-deep">Log in</button>
  </form>

  <div class="divider">or</div>

  <button class="btn btn-outline" onclick="usePasskey()">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    Use a passkey instead
  </button>

  <p class="form-foot">New to Standpoint? <a href="signup.html">Create an account</a></p>

  <div class="logo-slot-bottom">
    <div class="logo-placehold"><img src="img/LOGO/Untitled design.png" class="w-100 big" alt="Standpoint Logo"></div>
  </div>
</div>

<div class="help-fab" onclick="toggleHelp()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4"/><path d="M12 17h.01"/></svg>
</div>
<div class="help-popover" id="helpPopover">
  <b>Trouble logging in?</b>
  <p>Check that your email and password are correct, or reset your password below.</p>
  <a href="#">Reset my password</a>
  <a href="#">Email support@standpointhq.com</a>
</div>

<script>
  function togglePw(){
    var input = document.getElementById('pwInput');
    input.type = input.type === 'password' ? 'text' : 'password';
  }
  function toggleHelp(){
    document.getElementById('helpPopover').classList.toggle('open');
  }
  function usePasskey(){
    alert('This is a demo — passkey login would connect to your device\'s biometric or security key flow here.');
  }
  function handleLogin(e){
    e.preventDefault();
    alert('This is a demo form — no backend is connected yet.');
    return false;
  }
</script>
</body>
</html>
